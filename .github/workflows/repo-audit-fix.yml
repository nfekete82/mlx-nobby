name: Repo Audit Fix

on:
  push:
    branches:
      - chore/repo-audit-cleanup-2026-10-01

permissions:
  contents: write

jobs:
  fix-stale-juggernaut-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/repo-audit-cleanup-2026-10-01

      - name: Repair stale Juggernaut assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_image_runtime.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'assert service._resolved_steps(juggernaut, None, "quality") == 35':
                  'assert service._resolved_steps(juggernaut, None, "quality") == 30',
              'assert (quality["steps"], quality["guidance"]) == (35, 5.0)':
                  'assert (quality["steps"], quality["guidance"]) == (30, 5.0)',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence of {old!r}, found {count}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- tests/test_image_runtime.py

      - name: Commit exact test repair
        run: |
          if git diff --quiet -- tests/test_image_runtime.py; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_image_runtime.py
          git commit -m "test: align Juggernaut quality assertions with 30-step policy"
          git push origin HEAD:chore/repo-audit-cleanup-2026-10-01
