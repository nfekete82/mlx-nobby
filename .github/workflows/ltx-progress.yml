name: LTX long-video progress checks

on:
  pull_request:
    paths:
      - 'ltx_progress.py'
      - 'video_long.py'
      - 'frontend/assets/chat/rendering.js'
      - 'frontend/chat.html'
      - 'frontend/i18n/de.json'
      - 'frontend/i18n/en.json'
      - 'tests/test_video_job.mjs'
      - 'tests/test_ltx_progress_ui.py'
      - '.github/workflows/ltx-progress.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frontend progress rendering
        run: node tests/test_video_job.mjs
      - name: Check LTX progress log parser
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ltx_progress_ui.py
