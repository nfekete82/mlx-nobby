name: Tests

on:
  push:
  pull_request:

jobs:
  macos-tests:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip check

      - name: Python syntax
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Python tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Translation and JSON checks
        run: |
          git ls-files -z '*.json' | xargs -0 -n1 python -m json.tool >/dev/null
          python scripts/i18n-audit.py

      - name: JavaScript syntax
        run: |
          find frontend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: JavaScript tests
        run: |
          node tests/test_model_console.mjs
          node tests/test_chat_scroll.mjs
          node tests/test_history_cleanup.mjs
          node tests/test_i18n.mjs

      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/mlx
          bash -n scripts/doctor.sh
          bash -n scripts/install-launchd.sh
          bash -n scripts/mlx-server-start
          for template in launchd/templates/*.plist.template; do
            plutil -lint "$template" >/dev/null
          done

  docker-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config >/dev/null
