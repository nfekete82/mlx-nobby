name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip check

      - name: Python syntax
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Python tests
        run: |
          python -m pytest -q

      - name: Translation and JSON checks
        run: |
          git ls-files -z '*.json' | xargs -0 -n1 python -m json.tool >/dev/null
          python scripts/i18n-audit.py

      - name: JavaScript syntax
        run: |
          find frontend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: JavaScript tests
        run: |
          node --test tests/*.mjs

      - name: Shell syntax
        run: |
          git ls-files -z 'scripts/*.sh' | xargs -0 -n1 bash -n
          bash -n scripts/mlx
          bash -n scripts/mlx-server-start
          bash -n scripts/mlx-router-start
          bash -n scripts/setup-juggernaut-xi
          bash -n scripts/setup-ltx-video
          bash -n scripts/setup-ltx-video-mlx
          for template in launchd/templates/*.plist.template; do
            plutil -lint "$template" >/dev/null
          done

  docker-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: |
          docker compose config >/dev/null

      - name: Build web image
        run: |
          docker compose build \
            --build-arg MLX_NOBBY_BUILD_SHA=ci-test \
            mlx-web

      - name: Smoke test web-only imports in production image
        run: |
          docker compose run --rm --no-deps --entrypoint python mlx-web -c "
          import importlib.util
          assert importlib.util.find_spec('agent') is None, 'Unexpected agent installed in web image'
          from backend.web_research import retrieve_web_research, needs_web_research
          from backend.search_freshness import requires_today_news
          from backend.weather_search import is_locationless_weather_question
          assert needs_web_research('Wer ist aktuell Bundeskanzler?')
          assert requires_today_news('News von heute')
          assert is_locationless_weather_question('Wie wird das Wetter heute?')
          assert 'OHNE VERIFIZIERBARE' in retrieve_web_research(
              'News von heute', opener=lambda req, timeout: type('R', (), {
                  '__enter__': lambda self: self,
                  '__exit__': lambda self, *args: False,
                  'read': lambda self, n: b'<rss><channel/></rss>',
              })()
          )
          print('WEB_PACKAGE_IMPORTS_OK')
          "
