# Optional standalone research backend. Does not affect docker-compose.yml.
# Create .env.search (gitignored) with SEARXNG_SECRET before starting.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8081}:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env.search}"
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_PORT:-8081}/"
      SEARXNG_LIMITER: "false"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./search/searxng-settings.yml:/etc/searxng/settings.yml:ro
